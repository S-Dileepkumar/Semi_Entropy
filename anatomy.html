<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020205" />
  <title>Human Anatomy — Exploded View</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020205;
      --text: #e8f4ff;
      --muted: #8290a2;
      --cyan: #00f0ff;
      --magenta: #ff00aa;
      --violet: #8b5cf6;
      --amber: #ffaa00;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 3rem 1.25rem;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: radial-gradient(ellipse at 50% 40%, #101426 0, var(--bg) 62%);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    .anatomy-panel { width: min(100%, 980px); }
    .eyebrow {
      color: var(--cyan);
      font: 600 .72rem/1.4 ui-monospace, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: .65rem 0 .4rem; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.05em; }
    .intro { margin: 0; color: var(--muted); line-height: 1.6; }
    .stage {
      position: relative;
      height: min(72vh, 590px);
      min-height: 420px;
      margin: 1.5rem 0 1rem;
      overflow: hidden;
      border: 1px solid rgba(0,240,255,.16);
      border-radius: 1.25rem;
      background:
        linear-gradient(rgba(0,240,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,.035) 1px, transparent 1px),
        rgba(5,8,17,.72);
      background-size: 32px 32px;
      box-shadow: inset 0 0 70px rgba(0,240,255,.045), 0 20px 70px #0008;
    }
    .stage::before {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, transparent 20%, rgba(2,2,5,.65) 100%);
    }
    .figure {
      position: absolute;
      top: 50%; left: 50%;
      width: min(72%, 370px);
      height: 92%;
      transform: translate(-50%, -50%);
      overflow: visible;
    }
    .silhouette { fill: rgba(15,27,42,.58); stroke: rgba(0,240,255,.38); stroke-width: 1.5; }
    .guide { fill: none; stroke: rgba(0,240,255,.22); stroke-width: 1; stroke-dasharray: 4 7; }
    .organ { transform-box: fill-box; transform-origin: center; transition: transform 1.15s cubic-bezier(.2,.8,.2,1), opacity .7s ease; }
    .brain { fill: rgba(139,92,246,.66); stroke: #c4aaff; }
    .lung { fill: rgba(0,240,255,.3); stroke: #67f5ff; }
    .heart { fill: rgba(255,0,170,.7); stroke: #ff8ad7; }
    .liver { fill: rgba(255,170,0,.62); stroke: #ffd16b; }
    .stomach { fill: rgba(255,90,140,.42); stroke: #ff9cbb; }
    .intestine { fill: none; stroke: #ffb1d4; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .bone { fill: none; stroke: rgba(232,244,255,.55); stroke-width: 3; stroke-linecap: round; }
    .organ-shape { stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .label-line { fill: none; stroke: rgba(0,240,255,.56); stroke-width: 1; }
    .label-dot { fill: var(--cyan); }
    .organ-label { fill: #b7c8d8; font: 10px ui-monospace, monospace; letter-spacing: .08em; }
    .callouts { position: absolute; inset: 0; pointer-events: none; }
    .callout { position: absolute; color: #b7c8d8; font: .68rem ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .callout strong { display: block; color: var(--cyan); font-size: .62rem; font-weight: 500; }
    .callout.brain-tag { top: 9%; right: 8%; }
    .callout.lung-tag { top: 31%; left: 7%; }
    .callout.heart-tag { top: 43%; right: 7%; }
    .callout.gut-tag { bottom: 13%; left: 8%; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    button {
      appearance: none;
      padding: .8rem 1.15rem;
      border: 1px solid rgba(0,240,255,.55);
      border-radius: 999px;
      background: rgba(0,240,255,.1);
      color: var(--text);
      font: 600 .85rem system-ui, sans-serif;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: rgba(0,240,255,.2); transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    #state { color: var(--muted); font: .7rem ui-monospace, monospace; letter-spacing: .1em; }
    .is-exploded .brain { transform: translateY(-45px) scale(1.1); }
    .is-exploded .lung.left { transform: translate(-48px,-8px) rotate(-12deg); }
    .is-exploded .lung.right { transform: translate(48px,-8px) rotate(12deg); }
    .is-exploded .heart { transform: translate(0,20px) scale(1.12); }
    .is-exploded .liver { transform: translate(-45px,45px) rotate(-9deg); }
    .is-exploded .stomach { transform: translate(48px,57px) rotate(10deg); }
    .is-exploded .intestine { transform: translateY(85px) scale(1.08); }
    @media (max-width: 600px) {
      body { padding: 2rem 1rem; }
      .stage { min-height: 390px; height: 58vh; }
      .figure { width: 90%; height: 84%; }
      .callout { font-size: .56rem; }
      .callout strong { font-size: .53rem; }
      .callout.brain-tag { right: 3%; }
      .callout.lung-tag { left: 3%; }
      .callout.heart-tag { right: 3%; }
      .callout.gut-tag { left: 3%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="anatomy-panel">
    <div class="eyebrow">BIOLOGICAL SYSTEMS / 001</div>
    <h1>Human anatomy, <span style="color:var(--cyan)">deconstructed.</span></h1>
    <p class="intro">An interactive, schematic exploded view of the body's major organs. Select the control to separate or reassemble the layers.</p>

    <section class="stage" id="anatomyStage" aria-label="Interactive exploded view of human anatomy">
      <svg class="figure" viewBox="0 0 360 560" role="img" aria-labelledby="figureTitle figureDesc">
        <title id="figureTitle">Stylized human anatomy diagram</title>
        <desc id="figureDesc">A front-facing torso silhouette with brain, lungs, heart, liver, stomach, and intestines shown as separate colored layers.</desc>
        <!-- Neutral torso outline -->
        <path class="silhouette" d="M145 42 Q180 22 215 42 L236 62 Q252 68 268 88 L292 155 Q297 168 284 174 L268 178 L254 127 L248 198 Q261 221 255 269 L247 326 L267 480 Q269 494 252 496 L230 496 L215 365 L199 303 L180 310 L161 303 L145 365 L130 496 L108 496 Q91 494 93 480 L113 326 L105 269 Q99 221 112 198 L106 127 L90 178 L74 174 Q62 168 67 155 L91 88 Q107 68 124 62 Z" />
        <path class="guide" d="M180 63V485 M117 206H243 M115 314H245" />
        <!-- Skeleton hints -->
        <g class="bone" aria-hidden="true">
          <path d="M180 77V284 M140 123Q180 142 220 123 M135 145Q180 165 225 145 M130 168Q180 188 230 168 M128 191Q180 211 232 191" />
          <path d="M180 284V313 M162 305Q180 316 198 305" />
        </g>
        <!-- Brain -->
        <g class="organ brain" aria-label="Brain">
          <path class="organ-shape" d="M157 47 C145 35 151 23 162 25 C168 13 182 18 183 27 C195 20 207 30 201 40 C211 49 201 60 191 58 L166 59 C156 59 151 54 157 47Z" />
          <path d="M178 26v29M160 35q9-7 16 1m8 7q8-10 15-3" fill="none" stroke="#e8dfff" stroke-width="1.2" />
        </g>
        <!-- Lungs -->
        <g class="organ lung left" aria-label="Left lung">
          <path class="organ-shape" d="M172 116 C158 106 145 116 138 139 L128 183 Q126 198 141 196 Q160 191 171 176Z" />
        </g>
        <g class="organ lung right" aria-label="Right lung">
          <path class="organ-shape" d="M188 116 C202 106 215 116 222 139 L232 183 Q234 198 219 196 Q200 191 189 176Z" />
        </g>
        <!-- Heart -->
        <g class="organ heart" aria-label="Heart">
          <path class="organ-shape" d="M179 148 C165 132 147 148 158 166 L180 190 L202 166 C214 148 194 132 179 148Z" />
          <path d="M180 151v29m-8-19h-9m25 2h10" fill="none" stroke="#ffe0f4" stroke-width="1.4" />
        </g>
        <!-- Liver -->
        <g class="organ liver" aria-label="Liver">
          <path class="organ-shape" d="M126 218 Q153 204 181 216 L181 242 Q158 251 133 244 Q121 239 126 218Z" />
        </g>
        <!-- Stomach -->
        <g class="organ stomach" aria-label="Stomach">
          <path class="organ-shape" d="M198 210 Q211 212 207 227 Q203 239 216 247 Q226 256 216 268 Q204 280 189 264 Q178 252 187 237 Q193 226 188 217Z" />
        </g>
        <!-- Intestines -->
        <g class="organ" aria-label="Intestines">
          <path class="intestine" d="M145 277 Q180 265 215 277 Q224 283 216 292 Q180 303 144 292 Q136 287 145 277Z M149 282 Q175 291 207 281 M147 301 Q180 291 213 303 Q222 309 214 318 Q180 329 146 318 Q137 313 147 301Z M151 307 Q181 317 209 306" />
        </g>
        <!-- Leader-line annotations -->
        <g aria-hidden="true">
          <path class="label-line" d="M205 40H285L310 28"/><circle class="label-dot" cx="205" cy="40" r="2"/>
          <path class="label-line" d="M228 143H277L308 135"/><circle class="label-dot" cx="228" cy="143" r="2"/>
          <path class="label-line" d="M207 161H275L308 174"/><circle class="label-dot" cx="207" cy="161" r="2"/>
          <path class="label-line" d="M213 304H275L308 316"/><circle class="label-dot" cx="213" cy="304" r="2"/>
        </g>
        <g class="organ-label" aria-hidden="true">
          <text x="313" y="30">BRAIN</text>
          <text x="311" y="137">LUNGS</text>
          <text x="311" y="177">HEART</text>
          <text x="311" y="319">GUT</text>
        </g>
      </svg>
      <div class="callouts" aria-hidden="true">
        <div class="callout brain-tag"><strong>01 / NEURAL</strong>Brain</div>
        <div class="callout lung-tag"><strong>02 / RESPIRATORY</strong>Lungs</div>
        <div class="callout heart-tag"><strong>03 / CIRCULATORY</strong>Heart</div>
        <div class="callout gut-tag"><strong>04 / DIGESTIVE</strong>Organs</div>
      </div>
    </section>

    <div class="toolbar">
      <button id="explodeButton" type="button" aria-pressed="false" aria-controls="anatomyStage">Explode anatomy ↗</button>
      <span id="state" aria-live="polite">ASSEMBLED VIEW</span>
    </div>
  </main>
  <script>
    const stage = document.getElementById('anatomyStage');
    const button = document.getElementById('explodeButton');
    const state = document.getElementById('state');

    button.addEventListener('click', () => {
      const exploded = stage.classList.toggle('is-exploded');
      button.setAttribute('aria-pressed', String(exploded));
      button.textContent = exploded ? 'Reassemble anatomy ↙' : 'Explode anatomy ↗';
      state.textContent = exploded ? 'LAYERS SEPARATED' : 'ASSEMBLED VIEW';
    });
  </script>
</body>
</html>
